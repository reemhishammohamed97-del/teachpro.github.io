<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مُعلم برو السحابية</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .tab-active { background-color: #4f46e5; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body class="text-gray-800">

    <!-- شاشة تسجيل الدخول / التسجيل -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen bg-indigo-100">
        <div class="bg-white p-8 rounded shadow-md w-full max-w-md text-center">
            <h1 class="text-2xl font-bold mb-6 text-indigo-700">منصة مُعلم برو</h1>
            <p class="text-gray-500 mb-4">سجل الدخول للوصول إلى صفوفك وبياناتك</p>
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="border p-2 rounded w-full mb-3 text-right">
            <input type="password" id="password" placeholder="كلمة المرور" class="border p-2 rounded w-full mb-4 text-right">
            <button onclick="login()" class="bg-indigo-600 text-white w-full py-2 rounded hover:bg-indigo-700 mb-2">تسجيل الدخول</button>
            <button onclick="signup()" class="bg-green-600 text-white w-full py-2 rounded hover:bg-green-700 mb-4">إنشاء حساب جديد</button>
            <hr class="my-4">
            <button onclick="loginWithGoogle()" class="bg-white border border-gray-300 text-gray-700 w-full py-2 rounded hover:bg-gray-50 flex items-center justify-center">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 ml-2" alt="google">
                الدخول بحساب جوجل
            </button>
        </div>
    </div>

    <!-- الهيدر -->
    <header class="bg-indigo-700 text-white p-4 shadow-md hidden" id="app-header">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">منصة مُعلم برو</h1>
            <div class="flex items-center space-x-3 space-x-reverse">
                <span id="user-info" class="text-sm"></span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-sm px-3 py-1 rounded">تسجيل الخروج</button>
            </div>
        </div>
    </header>

    <!-- القائمة الرئيسية -->
    <nav class="bg-white shadow-sm mb-6 hidden" id="app-nav">
        <div class="container mx-auto flex flex-wrap p-2 space-x-2 space-x-reverse">
            <button onclick="showTab('classes')" id="tab-classes" class="px-4 py-2 rounded hover:bg-indigo-100 tab-active">الصفوف والطلاب</button>
            <button onclick="showTab('schedule')" id="tab-schedule" class="px-4 py-2 rounded hover:bg-indigo-100">الجدول الأسبوعي</button>
            <button onclick="showTab('session')" id="tab-session" class="px-4 py-2 rounded hover:bg-indigo-100">تسجيل الحصة والحضور</button>
            <button onclick="showTab('reports')" id="tab-reports" class="px-4 py-2 rounded hover:bg-indigo-100">تقارير الحصص</button>
            <button onclick="showTab('files')" id="tab-files" class="px-4 py-2 rounded hover:bg-indigo-100">مركز الملفات</button>
        </div>
    </nav>

    <main class="container mx-auto px-4 pb-10 hidden" id="app-main">
        
        <!-- قسم الصفوف والطلاب -->
        <section id="classes" class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">إدارة الصفوف</h2>
            <div class="flex space-x-2 space-x-reverse mb-4">
                <input type="text" id="className" placeholder="اسم الصف (مثال: الصف الأول الثانوي)" class="border p-2 rounded w-full">
                <button onclick="addClass()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">إضافة</button>
            </div>
            <div id="classesList" class="space-y-4"></div>
        </section>

        <!-- قسم الجدول الأسبوعي -->
        <section id="schedule" class="bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">مساعد الجدول الأسبوعي</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <select id="schClass" class="border p-2 rounded"></select>
                <select id="schDay" class="border p-2 rounded">
                    <option value="الأحد">الأحد</option>
                    <option value="الإثنين">الإثنين</option>
                    <option value="الثلاثاء">الثلاثاء</option>
                    <option value="الأربعاء">الأربعاء</option>
                    <option value="الخميس">الخميس</option>
                </select>
                <input type="time" id="schTime" class="border p-2 rounded">
            </div>
            <button onclick="addSchedule()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 mb-4">إضافة موعد</button>
            <div id="scheduleList" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
        </section>

        <!-- قسم تسجيل الحصة -->
        <section id="session" class="bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">تسجيل الحصة الحالية</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block mb-1">اختر الصف</label>
                    <select id="sessClass" onchange="loadStudentsForAttendance()" class="border p-2 rounded w-full"></select>
                </div>
                <div>
                    <label class="block mb-1">تاريخ الحصة</label>
                    <input type="date" id="sessDate" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block mb-1">مدة الحصة (دقائق)</label>
                    <input type="number" id="sessDuration" placeholder="مثال: 60" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block mb-1">اسم الدرس المشروح</label>
                    <input type="text" id="sessLesson" placeholder="مثال: الفصل الأول - الخلايا" class="border p-2 rounded w-full">
                </div>
            </div>
            <h3 class="font-bold mb-2">تسجيل الحضور:</h3>
            <div id="attendanceList" class="space-y-2 mb-4 max-h-60 overflow-y-auto border p-2 rounded"></div>
            <button onclick="saveSessionReport()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">حفظ تقرير ما بعد الحصة</button>
        </section>

        <!-- قسم التقارير -->
        <section id="reports" class="bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">تقارير ما بعد الحصة</h2>
            <div id="reportsList" class="space-y-4"></div>
        </section>

        <!-- قسم الملفات -->
        <section id="files" class="bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">مركز الملفات والواجبات</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <select id="fileClass" class="border p-2 rounded"></select>
                <select id="fileType" class="border p-2 rounded">
                    <option value="كتاب">كتاب</option>
                    <option value="عرض تقديمي">عرض تقديمي</option>
                    <option value="ورقة عمل">ورقة عمل</option>
                    <option value="واجب">واجب</option>
                </select>
                <input type="text" id="fileName" placeholder="اسم الملف" class="border p-2 rounded">
                <input type="url" id="fileUrl" placeholder="رابط الملف" class="border p-2 rounded">
            </div>
            <button onclick="addFile()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 mb-4">رفع/إضافة</button>
            <div id="filesList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <script>
        // ===== ضبط إعدادات Firebase هنا =====
        const firebaseConfig = {
          apiKey: "AIzaSyAYpVq54c9bgyhn5yLXtLo89Gblw-2IqYU",
          authDomain:"teacher-bro.firebaseapp.com",
          projectId: "teacher-bro",
          storageBucket: "teacher-bro.firebasestorage.app",
          messagingSenderId: "631056398143",
          appId: "1:631056398143:web:a7299c8ea3a20ea7aa058a"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let DB = { classes: [], schedules: [], reports: [], files: [] };
        let currentUser = null;

        // ===== نظام المصادقة =====
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, password).catch(e => alert("خطأ: " + e.message));
        }

        function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(email, password).catch(e => alert("خطأ: " + e.message));
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => alert("خطأ: " + e.message));
        }

        function logout() {
            auth.signOut();
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                document.getElementById('app-nav').classList.remove('hidden');
                document.getElementById('app-main').classList.remove('hidden');
                document.getElementById('user-info').innerText = `مرحباً، ${user.displayName || user.email}`;
                await loadData();
            } else {
                currentUser = null;
                DB = { classes: [], schedules: [], reports: [], files: [] };
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-header').classList.add('hidden');
                document.getElementById('app-nav').classList.add('hidden');
                document.getElementById('app-main').classList.add('hidden');
            }
        });

        // ===== التزامن مع قاعدة البيانات =====
        async function loadData() {
            if (!currentUser) return;
            try {
                const docRef = db.collection('users').doc(currentUser.uid);
                const doc = await docRef.get();
                if (doc.exists && doc.data().db) {
                    DB = doc.data().db;
                } else {
                    DB = { classes: [], schedules: [], reports: [], files: [] };
                    await docRef.set({ db: DB });
                }
                renderAll();
            } catch (error) {
                console.error("Error loading data: ", error);
                alert("حدث خطأ أثناء تحميل البيانات: " + error.message);
            }
        }

        async function saveData() {
            if (!currentUser) return;
            try {
                await db.collection('users').doc(currentUser.uid).set({ db: DB });
            } catch (error) {
                console.error("Error saving data: ", error);
                alert("حدث خطأ أثناء حفظ البيانات: " + error.message);
            }
        }

        // ===== التنقل بين التبويبات =====
        function showTab(tabName) {
            ['classes', 'schedule', 'session', 'reports', 'files'].forEach(t => {
                document.getElementById(t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('tab-active');
            });
            document.getElementById(tabName).classList.remove('hidden');
            document.getElementById('tab-' + tabName).classList.add('tab-active');
            renderAll();
        }

        // ===== الصفوف والطلاب =====
        function addClass() {
            const name = document.getElementById('className').value.trim();
            if (!name) return alert("الرجاء إدخال اسم الصف");
            DB.classes.push({ id: Date.now().toString(), name, students: [] });
            document.getElementById('className').value = '';
            saveData();
            renderAll();
        }

        function addStudent(classId) {
            const name = prompt("الرجاء إدخال اسم الطالب الجديد:");
            if (name && name.trim() !== "") {
                const cls = DB.classes.find(c => c.id === classId);
                if (cls) {
                    cls.students.push({ id: Date.now().toString(), name: name.trim() });
                    saveData();
                    renderClasses();
                }
            }
        }

        function deleteClass(classId) {
            if(!confirm("هل أنت متأكد من حذف الصف؟ سيتم حذف كل البيانات المرتبطة به.")) return;
            DB.classes = DB.classes.filter(c => c.id !== classId);
            saveData();
            renderAll();
        }

        // ===== الجدول =====
        function addSchedule() {
            const classId = document.getElementById('schClass').value;
            const day = document.getElementById('schDay').value;
            const time = document.getElementById('schTime').value;
            if (!classId || !time) return alert("الرجاء اختيار الصف والوقت");
            DB.schedules.push({ id: Date.now().toString(), classId, day, time });
            saveData();
            renderSchedule();
        }

        // ===== تسجيل الحصة =====
        function loadStudentsForAttendance() {
            const classId = document.getElementById('sessClass').value;
            const cls = DB.classes.find(c => c.id === classId);
            const list = document.getElementById('attendanceList');
            if (!cls) { list.innerHTML = ''; return; }
            list.innerHTML = cls.students.map(s => `
                <div class="flex items-center justify-between p-2 border-b">
                    <span>${s.name}</span>
                    <div>
                        <label class="ml-2 text-sm">حاضر <input type="radio" name="att_${s.id}" value="حاضر" checked></label>
                        <label class="text-sm">غائب <input type="radio" name="att_${s.id}" value="غائب"></label>
                        <input type="text" placeholder="التقييم" class="border rounded p-1 text-sm mr-2" id="eval_${s.id}">
                    </div>
                </div>
            `).join('');
        }

        function saveSessionReport() {
            const classId = document.getElementById('sessClass').value;
            const cls = DB.classes.find(c => c.id === classId);
            if (!cls) return alert("الرجاء اختيار الصف");
            
            const attendees = [];
            const absentees = [];
            
            cls.students.forEach(s => {
                const status = document.querySelector(`input[name="att_${s.id}"]:checked`).value;
                const evalInput = document.getElementById(`eval_${s.id}`).value;
                if (status === 'حاضر') attendees.push({ name: s.name, eval: evalInput || 'لم يتم التقييم' });
                else absentees.push(s.name);
            });

            DB.reports.push({
                id: Date.now().toString(), classId, className: cls.name,
                date: document.getElementById('sessDate').value,
                duration: document.getElementById('sessDuration').value,
                lesson: document.getElementById('sessLesson').value,
                attendees, absentees
            });
            saveData();
            alert("تم حفظ التقرير بنجاح!");
            document.getElementById('sessLesson').value = '';
        }

        // ===== الملفات =====
        function addFile() {
            const classId = document.getElementById('fileClass').value;
            const type = document.getElementById('fileType').value;
            const name = document.getElementById('fileName').value;
            const url = document.getElementById('fileUrl').value;
            if (!name || !url) return alert("الرجاء إدخال اسم الملف والرابط");
            DB.files.push({ id: Date.now().toString(), classId, type, name, url });
            saveData();
            renderFiles();
        }

        // ===== العرض (Rendering) =====
        function renderAll() {
            renderClasses();
            renderDropdowns();
            renderSchedule();
            renderReports();
            renderFiles();
        }

        function renderClasses() {
            const list = document.getElementById('classesList');
            list.innerHTML = DB.classes.map(c => `
                <div class="border p-4 rounded shadow-sm flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg text-indigo-700">${c.name}</h3>
                        <div class="text-sm text-gray-600 mt-1">
                            <strong>الطلاب:</strong> ${c.students.map(s => s.name).join('، ') || 'لا يوجد'}
                        </div>
                    </div>
                    <div>
                        <button onclick="addStudent('${c.id}')" class="bg-green-500 text-white text-sm px-2 py-1 rounded mb-2">+ طالب</button>
                        <button onclick="deleteClass('${c.id}')" class="bg-red-500 text-white text-sm px-2 py-1 rounded">حذف الصف</button>
                    </div>
                </div>
            `).join('') || '<p>لا توجد صفوف مضافة</p>';
        }

        function renderDropdowns() {
            const options = DB.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('schClass').innerHTML = options;
            document.getElementById('sessClass').innerHTML = options;
            document.getElementById('fileClass').innerHTML = options;
        }

        function renderSchedule() {
            const list = document.getElementById('scheduleList');
            const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
            list.innerHTML = days.map(day => {
                const dayClasses = DB.schedules.filter(s => s.day === day);
                return `
                    <div class="border p-3 rounded">
                        <h4 class="font-bold mb-2 text-indigo-600">${day}</h4>
                        ${dayClasses.map(s => {
                            const cls = DB.classes.find(c => c.id === s.classId);
                            return `<div class="text-sm bg-gray-100 p-2 rounded mb-1">${s.time} - ${cls ? cls.name : 'صف محذوف'}</div>`;
                        }).join('') || '<div class="text-sm text-gray-400">لا توجد حصص</div>'}
                    </div>
                `;
            }).join('');
        }

        function renderReports() {
            const list = document.getElementById('reportsList');
            list.innerHTML = DB.reports.map(r => `
                <div class="border p-4 rounded shadow-sm bg-gray-50">
                    <h3 class="font-bold text-lg text-indigo-700">تقرير: ${r.className}</h3>
                    <div class="grid grid-cols-2 gap-2 text-sm mt-2 mb-2">
                        <span><strong>التاريخ:</strong> ${r.date}</span>
                        <span><strong>المدة:</strong> ${r.duration} دقيقة</span>
                        <span class="col-span-2"><strong>الدرس:</strong> ${r.lesson}</span>
                    </div>
                    <div class="mt-2">
                        <strong>الحضور:</strong>
                        <ul class="list-disc pr-5 text-sm mt-1">
                            ${r.attendees.map(a => `<li>${a.name} - ${a.eval}</li>`).join('') || '<li>لا يوجد</li>'}
                        </ul>
                    </div>
                    <div class="mt-2 text-sm text-red-500">
                        <strong>الغائبون:</strong> ${r.absentees.join('، ') || 'لا يوجد'}
                    </div>
                </div>
            `).join('') || '<p>لا توجد تقارير بعد</p>';
        }

        function renderFiles() {
            const list = document.getElementById('filesList');
            list.innerHTML = DB.files.map(f => {
                const cls = DB.classes.find(c => c.id === f.classId);
                const colors = { 'كتاب': 'bg-blue-100 text-blue-800', 'عرض تقديمي': 'bg-purple-100 text-purple-800', 'ورقة عمل': 'bg-yellow-100 text-yellow-800', 'واجب': 'bg-red-100 text-red-800' };
                return `
                    <div class="border p-4 rounded shadow-sm">
                        <span class="text-xs font-bold px-2 py-1 rounded ${colors[f.type]}">${f.type}</span>
                        <h4 class="font-bold mt-2">${f.name}</h4>
                        <p class="text-xs text-gray-500 mb-2">${cls ? cls.name : ''}</p>
                        <a href="${f.url}" target="_blank" class="text-indigo-600 text-sm hover:underline">فتح الملف</a>
                    </div>
                `;
            }).join('') || '<p>لا توجد ملفات مضافة</p>';
        }
    </script>
</body>
</html>
