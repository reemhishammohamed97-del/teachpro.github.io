<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مُعلم متقن (نسخة محلية)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        .container { max-width: 1100px; margin: 0 auto; padding: 15px; }
        .bg-white { background: white; }
        .shadow { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .rounded { border-radius: 8px; }
        .p-6 { padding: 24px; }
        .p-4 { padding: 16px; }
        .p-2 { padding: 8px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-6 { margin-bottom: 24px; }
        .mt-2 { margin-top: 8px; }
        .flex { display: flex; }
        .flex-1 { flex: 1; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, 1fr); }
        .md\:grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
        .lg\:grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
        .lg\:col-span-2 { grid-column: span 2; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-sm { font-size: 14px; }
        .text-lg { font-size: 18px; }
        .text-xl { font-size: 20px; }
        .text-3xl { font-size: 30px; }
        .text-gray-800 { color: #1f2937; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-400 { color: #9ca3af; }
        .text-white { color: white; }
        .text-indigo-600 { color: #4f46e5; }
        .text-red-500 { color: #ef4444; }
        .bg-indigo-600 { background-color: #4f46e5; }
        .bg-indigo-100 { background-color: #e0e7ff; }
        .bg-indigo-50 { background-color: #eef2ff; }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-blue-50 { background-color: #eff6ff; }
        .bg-green-50 { background-color: #ecfdf5; }
        .bg-yellow-50 { background-color: #fffbeb; }
        .bg-red-50 { background-color: #fef2f2; }
        .bg-purple-50 { background-color: #faf5ff; }
        .font-bold { font-weight: bold; }
        .border { border: 1px solid #e5e7eb; }
        .border-b { border-bottom: 1px solid #e5e7eb; }
        .border-t-4 { border-top: 4px solid; }
        .border-red-500 { border-color: #ef4444; }
        .w-full { width: 100%; }
        .py-2 { padding-top: 8px; padding-bottom: 8px; }
        .py-10 { padding-top: 40px; padding-bottom: 40px; }
        .cursor-pointer { cursor: pointer; }
        input, select, button { outline: none; font-family: inherit; }
        input[type="text"], input[type="number"], input[type="url"], input[type="email"], input[type="password"], input[type="date"], select {
            border: 1px solid #d1d5db; padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box;
        }
        button { border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
        .btn-indigo { background-color: #4f46e5; }
        .btn-indigo:hover { background-color: #4338ca; }
        .btn-green { background-color: #16a34a; }
        .btn-green:hover { background-color: #15803d; }
        .btn-red { background-color: #dc2626; }
        .btn-red:hover { background-color: #b91c1c; }
        .tab-active { background-color: #4f46e5; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #e5e7eb; padding: 8px; }
        th { background-color: #4f46e5; color: white; }
        .day-checkbox:checked + label { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        label { display: inline-block; }
        .day-label { border: 1px solid #d1d5db; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        ul { margin: 0; padding-right: 20px; }
    </style>
</head>
<body>

<header class="bg-indigo-600 text-white p-4 shadow">
    <div class="container flex justify-between items-center">
        <h1 class="text-xl font-bold">منصة مُعلم متقن (تخزين محلي)</h1>
        <div>
            <button onclick="clearData()" class="btn-red text-sm py-1 px-3">مسح كل البيانات</button>
        </div>
    </div>
</header>

<nav class="bg-white shadow-sm mb-6">
    <div class="container flex flex-wrap p-2 gap-2">
        <button onclick="showTab('dashboard')" id="tab-dashboard" class="p-2 rounded cursor-pointer tab-active">الرئيسية</button>
        <button onclick="showTab('classes')" id="tab-classes" class="p-2 rounded cursor-pointer">الصفوف والطلاب</button>
        <button onclick="showTab('schedule')" id="tab-schedule" class="p-2 rounded cursor-pointer">الجدول الأسبوعي</button>
        <button onclick="showTab('session')" id="tab-session" class="p-2 rounded cursor-pointer">تسجيل الحصة والحضور</button>
        <button onclick="showTab('reports')" id="tab-reports" class="p-2 rounded cursor-pointer">تقارير الحصص</button>
        <button onclick="showTab('files')" id="tab-files" class="p-2 rounded cursor-pointer">مركز الملفات</button>
    </div>
</nav>

<main class="container pb-10">
    
    <section id="dashboard" class="bg-white p-6 rounded shadow">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">لوحة المعلومات والإحصائيات</h2>
        <div id="dashboardContent" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </section>

    <section id="classes" class="bg-white p-6 rounded shadow hidden">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">إدارة المجموعات والطلاب</h2>
        <div class="mb-6 p-4 border rounded bg-gray-50">
            <h3 class="font-bold mb-2 text-indigo-600">إضافة مجموعة جديدة</h3>
            <input type="text" id="className" placeholder="اسم المجموعة" class="mb-3">
            <label class="block mb-1 text-sm font-bold">اختر أيام الحصة:</label>
            <div class="flex flex-wrap gap-2 mb-4">
                <div><input type="checkbox" id="day_sun" value="الأحد" class="day-checkbox hidden"><label for="day_sun" class="day-label">الأحد</label></div>
                <div><input type="checkbox" id="day_mon" value="الإثنين" class="day-checkbox hidden"><label for="day_mon" class="day-label">الإثنين</label></div>
                <div><input type="checkbox" id="day_tue" value="الثلاثاء" class="day-checkbox hidden"><label for="day_tue" class="day-label">الثلاثاء</label></div>
                <div><input type="checkbox" id="day_wed" value="الأربعاء" class="day-checkbox hidden"><label for="day_wed" class="day-label">الأربعاء</label></div>
                <div><input type="checkbox" id="day_thu" value="الخميس" class="day-checkbox hidden"><label for="day_thu" class="day-label">الخميس</label></div>
            </div>
            <button onclick="addClass()" class="btn-indigo w-full">إضافة المجموعة</button>
        </div>
        <div class="mb-4 p-4 border rounded bg-indigo-50">
            <h3 class="font-bold mb-2 text-green-600">إضافة طالب سريع</h3>
            <div class="flex gap-2">
                <input type="text" id="studentName" placeholder="اسم الطالب" class="flex-1">
                <button onclick="quickAddStudent()" class="btn-green">إضافة لأول مجموعة</button>
            </div>
        </div>
        <div id="classesList"></div>
    </section>

    <section id="schedule" class="bg-white p-6 rounded shadow hidden">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">الجدول الأسبوعي</h2>
        <div class="mb-4 p-3 bg-indigo-50 rounded flex gap-2 items-center">
            <label class="font-bold text-sm">اختر الصف:</label>
            <select id="schClass" class="flex-1"></select>
        </div>
        <div id="scheduleTableContainer"></div>
    </section>

    <section id="session" class="bg-white p-6 rounded shadow hidden">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">تسجيل الحصة الحالية</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div><label class="block mb-1">اختر الصف</label><select id="sessClass" onchange="loadStudentsForAttendance()"></select></div>
            <div><label class="block mb-1">تاريخ الحصة</label><input type="date" id="sessDate"></div>
            <div><label class="block mb-1">مدة الحصة بالدقائق</label><input type="number" id="sessDuration" min="1" placeholder="60"></div>
            <div><label class="block mb-1">اسم الدرس المشروح</label><input type="text" id="sessLesson" placeholder="مثال: الفصل الأول"></div>
        </div>
        <h3 class="font-bold mb-2">تسجيل الحضور:</h3>
        <div id="attendanceList" class="border rounded p-2 mb-4"></div>
        <button onclick="saveSessionReport()" class="btn-green">حفظ تقرير ما بعد الحصة</button>
    </section>

    <section id="reports" class="bg-white p-6 rounded shadow hidden">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">تقارير ما بعد الحصة</h2>
        <div id="reportsList"></div>
    </section>

    <section id="files" class="bg-white p-6 rounded shadow hidden">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">مركز الملفات والواجبات</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <select id="fileClass"></select>
            <select id="fileType"><option value="كتاب">كتاب</option><option value="عرض تقديمي">عرض تقديمي</option><option value="ورقة عمل">ورقة عمل</option><option value="واجب">واجب</option></select>
            <input type="text" id="fileName" placeholder="اسم الملف">
            <input type="url" id="fileUrl" placeholder="رابط الملف">
        </div>
        <button onclick="addFile()" class="btn-indigo mb-4">رفع/إضافة</button>
        <div id="filesList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>
</main>

<script>
// نظام التخزين المحلي (بدون إنترنت ومجاني 100%)
const DB_KEY = 'teacher_bro_local_db';
const emptyDB = () => ({ classes: [], schedules: [], reports: [], files: [] });
let DB = emptyDB();

function loadData() {
    const stored = localStorage.getItem(DB_KEY);
    DB = stored ? JSON.parse(stored) : emptyDB();
    if (!DB.payments) DB.payments = []; // للتوافق مع لوحة التحكم
    renderAll();
}
function saveData() {
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
}
function clearData() {
    if (confirm('هل أنت متأكد من مسح جميع البيانات؟')) {
        localStorage.removeItem(DB_KEY);
        DB = emptyDB();
        renderAll();
    }
}

// دوال مساعدة
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function clean(str) { return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function encodeArg(val) { return encodeURIComponent(String(val ?? '')); }
function decodeArg(val) { return decodeURIComponent(val); }

function showTab(tabName) {
    ['dashboard', 'classes', 'schedule', 'session', 'reports', 'files'].forEach(t => {
        document.getElementById(t).classList.toggle('hidden', t !== tabName);
        document.getElementById('tab-' + t).classList.toggle('tab-active', t === tabName);
    });
}

// الصفوف والطلاب
function addClass() {
    const input = document.getElementById('className');
    if (!input.value.trim()) return alert('الرجاء إدخال اسم الصف');
    const days = Array.from(document.querySelectorAll('.day-checkbox:checked')).map(c => c.value);
    DB.classes.push({ id: newId(), name: input.value.trim(), days: days, students: [] });
    saveData(); input.value = ''; document.querySelectorAll('.day-checkbox').forEach(c => c.checked = false);
    renderClasses(); renderDropdowns();
}
function quickAddStudent() {
    const input = document.getElementById('studentName');
    if (!input.value.trim()) return alert('الرجاء إدخال اسم الطالب');
    if (DB.classes.length === 0) return alert('الرجاء إنشاء مجموعة أولاً');
    DB.classes[0].students.push({ id: newId(), name: input.value.trim() });
    saveData(); input.value = ''; renderClasses();
}
function addStudent(classId) {
    const cls = DB.classes.find(c => c.id === classId);
    const name = prompt('اسم الطالب الجديد:')?.trim();
    if (!name) return;
    cls.students.push({ id: newId(), name });
    saveData(); renderClasses();
}
function deleteClass(classId) {
    if (!confirm('حذف الصف وكل بياناته؟')) return;
    DB.classes = DB.classes.filter(c => c.id !== classId);
    DB.schedules = DB.schedules.filter(s => s.classId !== classId);
    DB.reports = DB.reports.filter(r => r.classId !== classId);
    DB.files = DB.files.filter(f => f.classId !== classId);
    saveData(); renderClasses(); renderDropdowns();
}

// الجدول
function addSchedule(day, time) {
    const classId = document.getElementById('schClass').value;
    if (!classId) return alert('اختر الصف أولاً');
    DB.schedules.push({ id: newId(), classId, day, time });
    saveData(); renderSchedule();
}
function deleteSchedule(scheduleId) {
    DB.schedules = DB.schedules.filter(s => s.id !== scheduleId);
    saveData(); renderSchedule();
}

// الحضور
function loadStudentsForAttendance() {
    const classId = document.getElementById('sessClass').value;
    const list = document.getElementById('attendanceList');
    const cls = DB.classes.find(c => c.id === classId);
    if (!cls || !cls.students.length) { list.innerHTML = '<p>لا يوجد طلاب</p>'; return; }
    list.innerHTML = cls.students.map(st => `
        <div class="flex justify-between p-2 border-b">
            <span>${clean(st.name)}</span>
            <div>
                <label>حاضر <input type="radio" name="att_${st.id}" value="حاضر" checked></label>
                <label>غائب <input type="radio" name="att_${st.id}" value="غائب"></label>
                <input type="text" placeholder="التقييم" style="width:100px; display:inline-block;" data-eval-id="${st.id}">
            </div>
        </div>`).join('');
}
function saveSessionReport() {
    const classId = document.getElementById('sessClass').value;
    const date = document.getElementById('sessDate').value;
    const duration = Number(document.getElementById('sessDuration').value);
    const lesson = document.getElementById('sessLesson').value;
    const cls = DB.classes.find(c => c.id === classId);
    if (!cls || !date || !lesson || duration <= 0) return alertيرجى إدخال البيانات بشكل صحيح');
    
    const attendees = [], absentees = [];
    cls.students.forEach(st => {
        const radio = document.querySelector(`input[name="att_${st.id}"]:checked`);
        const evalInput = document.querySelector(`input[data-eval-id="${st.id}"]`);
        if (radio.value === 'حاضر') attendees.push({ name: st.name, eval: evalInput.value || 'لم يتم التقييم' });
        else absentees.push(st.name);
    });
    
    DB.reports.push({ id: newId(), classId, className: cls.name, date, duration, lesson, attendees, absentees });
    saveData(); alert('تم حفظ التقرير'); renderReports();
}

// الملفات
function addFile() {
    const classId = document.getElementById('fileClass').value;
    const name = document.getElementById('fileName').value;
    const url = document.getElementById('fileUrl').value;
    if (!classId || !name || !url) return alert('يرجى إدخال اسم الملف ورابط صحيح');
    DB.files.push({ id: newId(), classId, type: document.getElementById('fileType').value, name, url });
    saveData(); document.getElementById('fileName').value = ''; document.getElementById('fileUrl').value = '';
    renderFiles();
}

// العرض
function renderAll() { renderDashboard(); renderClasses(); renderDropdowns(); renderSchedule(); renderReports(); renderFiles(); loadStudentsForAttendance(); }

function renderDashboard() {
    const c = document.getElementById('dashboardContent');
    const totalSt = DB.classes.reduce((s, c) => s + c.students.length, 0);
    const totalRep = DB.reports.length;
    const absent = DB.reports.reduce((s, r) => s + r.absentees.length, 0);
    const homework = DB.files.filter(f => f.type === 'واجب').length;
    const upcoming = DB.schedules.length;
    
    c.innerHTML = `
        <div class="bg-blue-50 p-4 rounded shadow text-center"><h3 class="text-sm text-gray-600">عدد الطلاب</h3><p class="text-3xl font-bold text-indigo-600 mt-2">${totalSt}</p></div>
        <div class="bg-green-50 p-4 rounded shadow text-center"><h3 class="text-sm text-gray-600">إجمالي الحصص</h3><p class="text-3xl font-bold text-indigo-600 mt-2">${totalRep}</p></div>
        <div class="bg-red-50 p-4 rounded shadow text-center"><h3 class="text-sm text-gray-600">عدد الغائبين</h3><p class="text-3xl font-bold text-red-500 mt-2">${absent}</p></div>
        <div class="bg-yellow-50 p-4 rounded shadow text-center"><h3 class="text-sm text-gray-600">الواجبات</h3><p class="text-3xl font-bold text-indigo-600 mt-2">${homework}</p></div>
        <div class="bg-white p-4 rounded shadow lg:col-span-2 border-t-4 border-red-500"><h3 class="font-bold border-b pb-2 mb-2">تنبيهات</h3><div class="text-sm">${absent > 0 ? `<div class="text-red-500">يوجد ${absent} غياب</div>` : '<div class="text-green-500">لا توجد تنبيهات</div>'}</div></div>
        <div class="bg-white p-4 rounded shadow lg:col-span-2"><h3 class="font-bold border-b pb-2 mb-2 text-indigo-600">الحصص القادمة</h3><div class="text-sm">${upcoming > 0 ? DB.schedules.slice(0,5).map(s => { const cl = DB.classes.find(c=>c.id==s.classId); return `<div>${clean(cl?.name)} - ${s.day} ${s.time}</div>` }).join('') : '<div class="text-gray-400">لا يوجد</div>'}</div></div>
    `;
}

function renderClasses() {
    document.getElementById('classesList').innerHTML = DB.classes.map(cls => `
        <div class="border p-4 rounded shadow mb-4 flex justify-between">
            <div>
                <h3 class="font-bold text-lg text-indigo-600">${clean(cls.name)}</h3>
                <div class="text-xs text-gray-600 mt-1">أيام الحصة: ${cls.days?.join('، ') || 'لم يحدد'}</div>
                <div class="text-sm mt-2">الطلاب: ${cls.students.map(s => clean(s.name)).join('، ') || 'لا يوجد'}</div>
            </div>
            <div class="flex flex-col gap-2">
                <button onclick="addStudent(decodeArg('${encodeArg(cls.id)}'))" class="btn-green text-sm">+ طالب</button>
                <button onclick="deleteClass(decodeArg('${encodeArg(cls.id)}'))" class="btn-red text-sm">حذف الصف</button>
            </div>
        </div>`).join('') || '<p class="text-center text-gray-400 py-4">لا توجد صفوف</p>';
}

function renderDropdowns() {
    ['schClass', 'sessClass', 'fileClass'].forEach(id => {
        const sel = document.getElementById(id);
        const prev = sel.value;
        sel.innerHTML = DB.classes.length ? DB.classes.map(c => `<option value="${c.id}">${clean(c.name)}</option>`).join('') : '<option value="">لا توجد صفوف</option>';
        if (DB.classes.find(c => c.id === prev)) sel.value = prev;
    });
}

function renderSchedule() {
    const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    const times = ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00'];
    let html = `<table><tr><th>الوقت</th>${days.map(d => `<th>${d}</th>`).join('')}</tr>`;
    times.forEach(time => {
        let [h, m] = time.split(':').map(Number);
        const period = h >= 12 ? 'م' : 'ص'; if (h > 12) h -= 12;
        html += `<tr><td class="font-bold text-indigo-600">${h}:${String(m).padStart(2,'0')} ${period}</td>`;
        days.forEach(day => {
            const sch = DB.schedules.find(s => s.day === day && s.time === time);
            const cls = sch && DB.classes.find(c => c.id === sch.classId);
            if (sch && cls) html += `<td style="cursor:pointer; background:#eef2ff;" onclick="deleteSchedule(decodeArg('${encodeArg(sch.id)}')">${clean(cls.name)} <span style="color:red; font-weight:bold;">×</span></td>`;
            else html += `<td style="cursor:pointer; color:#16a34a; font-weight:bold; font-size:18px;" onclick="addSchedule(decodeArg('${encodeArg(day)}'), decodeArg('${encodeArg(time)}') )">+</td>`;
        });
        html += '</tr>';
    });
    document.getElementById('scheduleTableContainer').innerHTML = html + '</table>';
}

function renderReports() {
    document.getElementById('reportsList').innerHTML = DB.reports.map(r => `
        <div class="border p-4 rounded shadow mb-4 bg-gray-50">
            <h3 class="font-bold text-indigo-600">تقرير: ${clean(r.className)}</h3>
            <div class="text-sm mt-2">التاريخ: ${r.date} | المدة: ${r.duration} دقيقة | الدرس: ${clean(r.lesson)}</div>
            <div class="mt-2 text-sm"><strong>الحضور:</strong> <ul>${r.attendees.map(a => `<li>${clean(a.name)} - ${clean(a.eval)}</li>`).join('')}</ul></div>
            <div class="mt-2 text-sm text-red-500"><strong>الغائبون:</strong> ${r.absentees.map(a => clean(a)).join('، ') || 'لا يوجد'}</div>
        </div>`).join('') || '<p class="text-center text-gray-400 py-4">لا توجد تقارير</p>';
}

function renderFiles() {
    document.getElementById('filesList').innerHTML = DB.files.map(f => `
        <div class="border p-4 rounded shadow">
            <h4 class="font-bold">${clean(f.name)}</h4>
            <div class="text-sm text-gray-500 mb-2">${f.type}</div>
            <a href="${clean(f.url)}" target="_blank" class="text-indigo-600 text-sm">فتح الملف</a>
        </div>`).join('') || '<p class="text-center text-gray-400 py-4">لا توجد ملفات</p>';
}

// بدء التشغيل
loadData();
</script>
</body>
</html>
