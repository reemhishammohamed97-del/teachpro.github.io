<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Pro Cloud Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
        }

        .tab-active {
            background-color: #4f46e5;
            color: white;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Login and registration screen -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen bg-indigo-100">
        <div class="bg-white p-8 rounded shadow-md w-full max-w-md text-center">
            <h1 class="text-2xl font-bold mb-6 text-indigo-700">Teacher Pro Platform</h1>
            <p class="text-gray-500 mb-4">Log in to access your classes and data</p>

            <input
                type="email"
                id="email"
                placeholder="Email address"
                class="border p-2 rounded w-full mb-3 text-left"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                class="border p-2 rounded w-full mb-4 text-left"
            >

            <button
                onclick="login()"
                class="bg-indigo-600 text-white w-full py-2 rounded hover:bg-indigo-700 mb-2"
            >
                Log In
            </button>

            <button
                onclick="signup()"
                class="bg-green-600 text-white w-full py-2 rounded hover:bg-green-700 mb-4"
            >
                Create New Account
            </button>

            <hr class="my-4">

            <button
                onclick="loginWithGoogle()"
                class="bg-white border border-gray-300 text-gray-700 w-full py-2 rounded hover:bg-gray-50 flex items-center justify-center"
            >
                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    class="w-5 h-5 mr-2"
                    alt="Google"
                >
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-4 shadow-md hidden" id="app-header">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Teacher Pro Platform</h1>

            <div class="flex items-center space-x-3">
                <span id="user-info" class="text-sm"></span>
                <button
                    onclick="logout()"
                    class="bg-red-500 hover:bg-red-600 text-white text-sm px-3 py-1 rounded"
                >
                    Log Out
                </button>
            </div>
        </div>
    </header>

    <!-- Main navigation -->
    <nav class="bg-white shadow-sm mb-6 hidden" id="app-nav">
        <div class="container mx-auto flex flex-wrap p-2 space-x-2">
            <button
                onclick="showTab('classes')"
                id="tab-classes"
                class="px-4 py-2 rounded hover:bg-indigo-100 tab-active"
            >
                Classes and Students
            </button>

            <button
                onclick="showTab('schedule')"
                id="tab-schedule"
                class="px-4 py-2 rounded hover:bg-indigo-100"
            >
                Weekly Schedule
            </button>

            <button
                onclick="showTab('session')"
                id="tab-session"
                class="px-4 py-2 rounded hover:bg-indigo-100"
            >
                Lesson and Attendance
            </button>

            <button
                onclick="showTab('reports')"
                id="tab-reports"
                class="px-4 py-2 rounded hover:bg-indigo-100"
            >
                Lesson Reports
            </button>

            <button
                onclick="showTab('files')"
                id="tab-files"
                class="px-4 py-2 rounded hover:bg-indigo-100"
            >
                File Center
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-4 pb-10 hidden" id="app-main">

        <!-- Classes and students section -->
        <section id="classes" class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Class Management</h2>

            <div class="flex space-x-2 mb-4">
                <input
                    type="text"
                    id="className"
                    placeholder="Class name, e.g. Grade 10"
                    class="border p-2 rounded w-full"
                >

                <button
                    onclick="addClass()"
                    class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700"
                >
                    Add
                </button>
            </div>

            <div id="classesList" class="space-y-4"></div>
        </section>

        <!-- Weekly schedule section -->
        <section id="schedule" class="bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Weekly Schedule Assistant</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <select id="schClass" class="border p-2 rounded"></select>

                <select id="schDay" class="border p-2 rounded">
                    <option value="Sunday">Sunday</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                </select>

                <input type="time" id="schTime" class="border p-2 rounded">
            </div>

            <button
                onclick="addSchedule()"
                class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 mb-4"
            >
                Add Schedule
            </button>

            <div id="scheduleList" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
        </section>

        <!-- Lesson session section -->
        <section id="session" class="bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Record Current Lesson</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block mb-1">Select Class</label>
                    <select
                        id="sessClass"
                        onchange="loadStudentsForAttendance()"
                        class="border p-2 rounded w-full"
                    ></select>
                </div>

                <div>
                    <label class="block mb-1">Lesson Date</label>
                    <input type="date" id="sessDate" class="border p-2 rounded w-full">
                </div>

                <div>
                    <label class="block mb-1">Lesson Duration (minutes)</label>
                    <input
                        type="number"
                        id="sessDuration"
                        placeholder="Example: 60"
                        class="border p-2 rounded w-full"
                    >
                </div>

                <div>
                    <label class="block mb-1">Lesson Topic</label>
                    <input
                        type="text"
                        id="sessLesson"
                        placeholder="Example: Chapter 1 - Cells"
                        class="border p-2 rounded w-full"
                    >
                </div>
            </div>

            <h3 class="font-bold mb-2">Record Attendance:</h3>
            <div
                id="attendanceList"
                class="space-y-2 mb-4 max-h-60 overflow-y-auto border p-2 rounded"
            ></div>

            <button
                onclick="saveSessionReport()"
                class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
            >
                Save Lesson Report
            </button>
        </section>

        <!-- Reports section -->
        <section id="reports" class="bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Lesson Reports</h2>
            <div id="reportsList" class="space-y-4"></div>
        </section>

        <!-- Files section -->
        <section id="files" class="bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Files and Assignments</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <select id="fileClass" class="border p-2 rounded"></select>

                <select id="fileType" class="border p-2 rounded">
                    <option value="Book">Book</option>
                    <option value="Presentation">Presentation</option>
                    <option value="Worksheet">Worksheet</option>
                    <option value="Assignment">Assignment</option>
                </select>

                <input
                    type="text"
                    id="fileName"
                    placeholder="File name"
                    class="border p-2 rounded"
                >

                <input
                    type="url"
                    id="fileUrl"
                    placeholder="File URL"
                    class="border p-2 rounded"
                >
            </div>

            <button
                onclick="addFile()"
                class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 mb-4"
            >
                Add File
            </button>

            <div id="filesList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAYpVq54c9bgyhn5yLXtLo89Gblw-2IqYU",
            authDomain: "teacher-bro.firebaseapp.com",
            projectId: "teacher-bro",
            storageBucket: "teacher-bro.firebasestorage.app",
            messagingSenderId: "631056398143",
            appId: "1:631056398143:web:a7299c8ea3a20ea7aa058a"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        let DB = {
            classes: [],
            schedules: [],
            reports: [],
            files: []
        };

        let currentUser = null;

        // Authentication
        function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .catch(error => alert("Error: " + error.message));
        }

        function signup() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .catch(error => alert("Error: " + error.message));
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();

            auth.signInWithPopup(provider)
                .catch(error => alert("Error: " + error.message));
        }

        function logout() {
            auth.signOut();
        }

        // Monitor authentication state
        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;

                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                document.getElementById('app-nav').classList.remove('hidden');
                document.getElementById('app-main').classList.remove('hidden');
                document.getElementById('user-info').innerText =
                    `Welcome, ${user.displayName || user.email}`;

                await loadData();
            } else {
                currentUser = null;

                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-header').classList.add('hidden');
                document.getElementById('app-nav').classList.add('hidden');
                document.getElementById('app-main').classList.add('hidden');
            }
        });

        // Firestore synchronization
        async function loadData() {
            if (!currentUser) return;

            try {
                const docRef = db.collection('users').doc(currentUser.uid);
                const doc = await docRef.get();

                if (doc.exists && doc.data().db) {
                    DB = doc.data().db;
                } else {
                    DB = {
                        classes: [],
                        schedules: [],
                        reports: [],
                        files: []
                    };

                    await docRef.set({ db: DB });
                }

                renderAll();
            } catch (error) {
                console.error("Error loading data:", error);
                alert("An error occurred while loading data: " + error.message);
            }
        }

        async function saveData() {
            if (!currentUser) return;

            try {
                await db.collection('users').doc(currentUser.uid).set({ db: DB });
            } catch (error) {
                console.error("Error saving data:", error);
                alert("An error occurred while saving data: " + error.message);
            }
        }

        // Navigation
        function showTab(tabName) {
            ['classes', 'schedule', 'session', 'reports', 'files'].forEach(tab => {
                document.getElementById(tab).classList.add('hidden');
                document.getElementById('tab-' + tab).classList.remove('tab-active');
            });

            document.getElementById(tabName).classList.remove('hidden');
            document.getElementById('tab-' + tabName).classList.add('tab-active');

            renderAll();
        }

        // Classes and students
        function addClass() {
            const name = document.getElementById('className').value.trim();

            if (!name) {
                return alert("Please enter a class name.");
            }

            DB.classes.push({
                id: Date.now().toString(),
                name,
                students: []
            });

            document.getElementById('className').value = '';

            saveData();
            renderAll();
        }

        function addStudent(classId) {
            const name = prompt("Enter the new student's name:");

            if (name && name.trim() !== "") {
                const cls = DB.classes.find(classItem => classItem.id === classId);

                if (cls) {
                    cls.students.push({
                        id: Date.now().toString(),
                        name: name.trim()
                    });

                    saveData();
                    renderClasses();
                }
            }
        }

        function deleteClass(classId) {
            if (!confirm("Are you sure you want to delete this class and its related data?")) {
                return;
            }

            DB.classes = DB.classes.filter(classItem => classItem.id !== classId);
            DB.schedules = DB.schedules.filter(schedule => schedule.classId !== classId);
            DB.files = DB.files.filter(file => file.classId !== classId);
            DB.reports = DB.reports.filter(report => report.classId !== classId);

            saveData();
            renderAll();
        }

        // Schedule
        function addSchedule() {
            const classId = document.getElementById('schClass').value;
            const day = document.getElementById('schDay').value;
            const time = document.getElementById('schTime').value;

            if (!classId || !time) {
                return alert("Please select a class and time.");
            }

            DB.schedules.push({
                id: Date.now().toString(),
                classId,
                day,
                time
            });

            saveData();
            renderSchedule();
        }

        // Attendance
        function loadStudentsForAttendance() {
            const classId = document.getElementById('sessClass').value;
            const cls = DB.classes.find(classItem => classItem.id === classId);
            const list = document.getElementById('attendanceList');

            if (!cls) {
                list.innerHTML = '';
                return;
            }

            list.innerHTML = cls.students.map(student => `
                <div class="flex items-center justify-between p-2 border-b">
                    <span>${student.name}</span>

                    <div>
                        <label class="mr-2 text-sm">
                            Present
                            <input
                                type="radio"
                                name="att_${student.id}"
                                value="Present"
                                checked
                            >
                        </label>

                        <label class="text-sm">
                            Absent
                            <input
                                type="radio"
                                name="att_${student.id}"
                                value="Absent"
                            >
                        </label>

                        <input
                            type="text"
                            placeholder="Evaluation"
                            class="border rounded p-1 text-sm ml-2"
                            id="eval_${student.id}"
                        >
                    </div>
                </div>
            `).join('');
        }

        function saveSessionReport() {
            const classId = document.getElementById('sessClass').value;
            const cls = DB.classes.find(classItem => classItem.id === classId);

            if (!cls) {
                return alert("Please select a class.");
            }

            const attendees = [];
            const absentees = [];

            cls.students.forEach(student => {
                const selectedStatus = document.querySelector(
                    `input[name="att_${student.id}"]:checked`
                );

                if (!selectedStatus) return;

                const status = selectedStatus.value;
                const evalInput = document.getElementById(`eval_${student.id}`).value;

                if (status === 'Present') {
                    attendees.push({
                        name: student.name,
                        eval: evalInput || 'Not evaluated'
                    });
                } else {
                    absentees.push(student.name);
                }
            });

            DB.reports.push({
                id: Date.now().toString(),
                classId,
                className: cls.name,
                date: document.getElementById('sessDate').value,
                duration: document.getElementById('sessDuration').value,
                lesson: document.getElementById('sessLesson').value,
                attendees,
                absentees
            });

            saveData();

            alert("The lesson report was saved successfully.");
            document.getElementById('sessLesson').value = '';
        }

        // Files
        function addFile() {
            const classId = document.getElementById('fileClass').value;
            const type = document.getElementById('fileType').value;
            const name = document.getElementById('fileName').value.trim();
            const url = document.getElementById('fileUrl').value.trim();

            if (!name || !url) {
                return alert("Please enter the file name and URL.");
            }

            DB.files.push({
                id: Date.now().toString(),
                classId,
                type,
                name,
                url
            });

            saveData();
            renderFiles();
        }

        // Rendering
        function renderAll() {
            renderClasses();
            renderDropdowns();
            renderSchedule();
            renderReports();
            renderFiles();
        }

        function renderClasses() {
            const list = document.getElementById('classesList');

            list.innerHTML = DB.classes.map(cls => `
                <div class="border p-4 rounded shadow-sm flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg text-indigo-700">${cls.name}</h3>

                        <div class="text-sm text-gray-600 mt-1">
                            <strong>Students:</strong>
                            ${cls.students.map(student => student.name).join(', ') || 'None'}
                        </div>
                    </div>

                    <div>
                        <button
                            onclick="addStudent('${cls.id}')"
                            class="bg-green-500 text-white text-sm px-2 py-1 rounded mb-2"
                        >
                            + Student
                        </button>

                        <button
                            onclick="deleteClass('${cls.id}')"
                            class="bg-red-500 text-white text-sm px-2 py-1 rounded"
                        >
                            Delete Class
                        </button>
                    </div>
                </div>
            `).join('') || '<p>No classes have been added.</p>';
        }

        function renderDropdowns() {
            const options = DB.classes.length
                ? DB.classes.map(cls =>
                    `<option value="${cls.id}">${cls.name}</option>`
                ).join('')
                : '<option value="">No classes available</option>';

            document.getElementById('schClass').innerHTML = options;
            document.getElementById('sessClass').innerHTML = options;
            document.getElementById('fileClass').innerHTML = options;
        }

        function renderSchedule() {
            const list = document.getElementById('scheduleList');
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday'];

            list.innerHTML = days.map(day => {
                const dayClasses = DB.schedules.filter(schedule => schedule.day === day);

                return `
                    <div class="border p-3 rounded">
                        <h4 class="font-bold mb-2 text-indigo-600">${day}</h4>

                        ${dayClasses.map(schedule => {
                            const cls = DB.classes.find(
                                classItem => classItem.id === schedule.classId
                            );

                            return `
                                <div class="text-sm bg-gray-100 p-2 rounded mb-1">
                                    ${schedule.time} - ${cls ? cls.name : 'Deleted class'}
                                </div>
                            `;
                        }).join('') || '<div class="text-sm text-gray-400">No lessons</div>'}
                    </div>
                `;
            }).join('');
        }

        function renderReports() {
            const list = document.getElementById('reportsList');

            list.innerHTML = DB.reports.map(report => `
                <div class="border p-4 rounded shadow-sm bg-gray-50">
                    <h3 class="font-bold text-lg text-indigo-700">
                        Report: ${report.className}
                    </h3>

                    <div class="grid grid-cols-2 gap-2 text-sm mt-2 mb-2">
                        <span><strong>Date:</strong> ${report.date}</span>
                        <span><strong>Duration:</strong> ${report.duration} minutes</span>
                        <span class="col-span-2">
                            <strong>Lesson:</strong> ${report.lesson}
                        </span>
                    </div>

                    <div class="mt-2">
                        <strong>Present:</strong>

                        <ul class="list-disc pl-5 text-sm mt-1">
                            ${report.attendees.map(attendee =>
                                `<li>${attendee.name} - ${attendee.eval}</li>`
                            ).join('') || '<li>None</li>'}
                        </ul>
                    </div>

                    <div class="mt-2 text-sm text-red-500">
                        <strong>Absent:</strong>
                        ${report.absentees.join(', ') || 'None'}
                    </div>
                </div>
            `).join('') || '<p>No reports yet.</p>';
        }

        function renderFiles() {
            const list = document.getElementById('filesList');

            list.innerHTML = DB.files.map(file => {
                const cls = DB.classes.find(
                    classItem => classItem.id === file.classId
                );

                const colors = {
                    Book: 'bg-blue-100 text-blue-800',
                    Presentation: 'bg-purple-100 text-purple-800',
                    Worksheet: 'bg-yellow-100 text-yellow-800',
                    Assignment: 'bg-red-100 text-red-800'
                };

                return `
                    <div class="border p-4 rounded shadow-sm">
                        <span class="text-xs font-bold px-2 py-1 rounded ${colors[file.type] || ''}">
                            ${file.type}
                        </span>

                        <h4 class="font-bold mt-2">${file.name}</h4>
                        <p class="text-xs text-gray-500 mb-2">
                            ${cls ? cls.name : ''}
                        </p>

                        <a
                            href="${file.url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="text-indigo-600 text-sm hover:underline"
                        >
                            Open File
                        </a>
                    </div>
                `;
            }).join('') || '<p>No files have been added.</p>';
        }
    </script>
</body>
</html>
